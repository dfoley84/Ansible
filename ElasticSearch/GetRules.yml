- name: Get all connectors
  uri:
    url: "{{ Kibana_URL }}/api/alerting/rules/_find"
    method: GET
    headers:
      Authorization: "ApiKey {{ Kibana_API_Key }}"
      Content-Type: "application/json"
      kbn-xsrf: "true"
    body_format: json
    status_code: 200
    validate_certs: yes
  register: rules_result
